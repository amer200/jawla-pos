<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
    <title>كاشير - نظام جولة</title>
    <style>
        body {
            background-color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            user-select: none;
        }
        
        .shift-info-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }
        
        .category-pill {
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .category-pill:hover,
        .category-pill.active {
            background: #0d6efd;
            color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.3);
        }
        
        .product-grid {
            height: calc(100vh - 290px);
            overflow-y: auto;
            padding: 4px;
        }
        
        .product-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 12px;
            height: 100%;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .product-card:hover {
            transform: translateY(-2px);
            border-color: #0d6efd;
            box-shadow: 0 6px 16px rgba(13, 110, 253, 0.12);
        }
        
        .bill-side {
            background: #ffffff;
            height: 100vh;
            border-right: 2px solid #e2e8f0;
            padding: 20px;
            box-shadow: -6px 0 16px rgba(0, 0, 0, 0.04);
        }
        
        .total-box {
            background: #0f172a;
            color: #22c55e;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #ffffff;
            border: 2px solid #0d6efd;
            border-radius: 0 0 10px 10px;
            z-index: 99999;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            display: none;
        }
        
        .suggestions-box .list-group-item {
            cursor: pointer;
            padding: 10px 15px;
            border-left: none;
            border-right: none;
        }
        
        .suggestions-box .list-group-item:hover {
            background-color: #f1f5f9;
        }
        
        .qty-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- جانب المنتجات وقارئ الباركود -->
            <div class="col-md-8 p-3 d-flex flex-column" style="height: 100vh;">

                <!-- بطاقة العهدة والمبيعات الأخيرة -->
                <div class="shift-info-card mb-3">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2 px-3">
                        <span class="small fw-bold"><i class="fas fa-cash-register me-2 text-warning"></i> عهدتك الحالية</span>
                        <span class="badge bg-success fs-6" id="myShiftTotal">0.00 ج.م</span>
                    </div>
                    <div class="table-responsive" style="max-height: 105px; overflow-y: auto;">
                        <table class="table table-sm table-hover mb-0 text-center" style="font-size: 0.85rem;">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th>رقم الفاتورة</th>
                                    <th>الوقت</th>
                                    <th>المبلغ</th>
                                </tr>
                            </thead>
                            <tbody id="myRecentSalesTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- حقل البحث والباركود السريع -->
                <div class="mb-3 position-relative">
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-primary text-white"><i class="fas fa-barcode"></i></span>
                        <input type="text" id="barcodeInput" class="form-control" placeholder="امسح الباركود أو ابحث عن منتج واضغط Enter..." autofocus autocomplete="off">
                    </div>
                    <div id="suggestionsBox" class="list-group position-absolute w-100 suggestions-box"></div>
                </div>

                <!-- شريط تصنيفات المنتجات -->
                <div class="d-flex gap-2 overflow-auto pb-2 mb-2" id="categoryFilterBar"></div>

                <!-- شبكة المنتجات التفاعلية -->
                <div class="product-grid row g-2" id="productsDisplay"></div>
            </div>

            <!-- جانب الفاتورة والسلة والحساب -->
            <div class="col-md-4 bill-side d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4 class="mb-0 text-primary fw-bold"><i class="fas fa-file-invoice-dollar me-2"></i> الفاتورة</h4>
                    <span class="text-muted small fw-bold" id="currentDate"></span>
                </div>

                <!-- جدول عناصر الفاتورة -->
                <div class="table-responsive flex-grow-1 border rounded bg-light my-2">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-secondary small">
                            <tr>
                                <th>المنتج</th>
                                <th class="text-center" style="width: 100px;">الكمية</th>
                                <th class="text-center">السعر</th>
                                <th style="width: 30px;"></th>
                            </tr>
                        </thead>
                        <tbody id="billTableBody"></tbody>
                    </table>
                </div>

                <!-- صندوق الحساب الإجمالي وأزرار الإنهاء -->
                <div class="mt-auto">
                    <div class="total-box mb-3 text-center">
                        <small class="text-uppercase text-light opacity-75" style="letter-spacing: 1px;">الإجمالي النهائي</small>
                        <h2 id="grandTotal" class="mb-0 fw-bold">0.00 ج.م</h2>
                    </div>

                    <div class="row g-2">
                        <div class="col-12 mb-1">
                            <div class="form-check form-switch d-flex justify-content-center align-items-center bg-light p-2 rounded border">
                                <input class="form-check-input me-2" type="checkbox" id="shouldPrintReceipt" checked>
                                <label class="form-check-label fw-bold small text-dark" for="shouldPrintReceipt">طباعة إيصال بيع تلقائياً</label>
                            </div>
                        </div>
                        <div class="col-8">
                            <button id="checkoutBtn" class="btn btn-success btn-lg w-100 fw-bold py-2">
                                <i class="fas fa-check-circle me-1"></i> إنهاء وبيع
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn btn-outline-danger btn-lg w-100 py-2" id="cancelBill" title="إلغاء الفاتورة">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/cashier-renderer.js"></script>
</body>

</html>
