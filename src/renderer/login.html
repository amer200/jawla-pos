<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - نظام جولة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .title-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
            -webkit-app-region: drag;
        }
        
        .close-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: color 0.2s;
        }
        
        .close-btn:hover {
            color: #ff4d4d;
        }
        
        .login-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 380px;
            text-align: center;
            -webkit-app-region: no-drag;
        }
        
        .brand-icon {
            color: #1e3c72;
            margin-bottom: 12px;
        }
        
        .input-group-text {
            background-color: #f8f9fa;
            border-left: none;
        }
        
        .form-control {
            border-right: none;
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }
        
        .btn-primary {
            background-color: #1e3c72;
            border: none;
            padding: 10px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .btn-primary:hover {
            background-color: #2a5298;
        }
    </style>
</head>

<body>

    <div class="title-bar">
        <button class="close-btn" id="exitBtn" title="إغلاق البرنامج">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fas fa-cash-register fa-3x"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">نظام جولة POS</h4>
        <p class="text-muted small mb-4">إدارة نقاط البيع والمستودعات</p>

        <div class="alert alert-danger py-2 small d-none" id="errorAlert" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="اسم المستخدم" autocomplete="off" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="كلمة المرور" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i> دخول للنظام
            </button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorAlert = document.getElementById('errorAlert');
        const exitBtn = document.getElementById('exitBtn');

        // إغلاق النافذة
        exitBtn.addEventListener('click', () => {
            if (window.api && window.api.closeApp) {
                window.api.closeApp();
            }
        });

        // تنفيذ المصادقة
        loginForm.addEventListener('submit', async(e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) return;

            // إخفاء أي خطأ سابق وتفعيل حالة التحميل
            errorAlert.classList.add('d-none');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري التحقق...';

            try {
                const result = await window.api.login({
                    username,
                    password
                });

                if (!result.success) {
                    errorAlert.innerText = result.message || 'بيانات الدخول غير صحيحة';
                    errorAlert.classList.remove('d-none');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> دخول للنظام';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
                // في حالة النجاح، الـ Main Process هو من سيتولى فتح الشاشة المناسبة وإغلاق هذه النافذة
            } catch (err) {
                console.error("Login Error:", err);
                errorAlert.innerText = 'تعذر الاتصال بالنظام الخلفي';
                errorAlert.classList.remove('d-none');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> دخول للنظام';
            }
        });
    </script>
</body>

</html>
